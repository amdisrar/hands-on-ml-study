<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
<title id="title">Instance-based learning using three nearest neighbors</title>
<desc id="desc">A new point marked with a question mark is near two blue triangles and one orange square, and is therefore classified as a triangle by majority vote.</desc>
<rect width="820" height="500" fill="#ffffff"/>
<text x="410" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#1e293b">Instance-Based Learning: 3 Nearest Neighbors</text>
<line x1="95" y1="424" x2="710" y2="424" stroke="#475569" stroke-width="2"/>
<line x1="95" y1="424" x2="95" y2="88" stroke="#475569" stroke-width="2"/>
<text x="655" y="453" font-family="Arial,sans-serif" font-size="17" fill="#334155">Feature 1</text>
<text x="30" y="105" font-family="Arial,sans-serif" font-size="17" fill="#334155" transform="rotate(-90 30 105)">Feature 2</text>
<circle cx="390" cy="246" r="124" fill="#dbeafe" fill-opacity="0.24" stroke="#64748b" stroke-dasharray="8 6" stroke-width="2"/>
<g fill="#2563eb" stroke="#1e40af" stroke-width="2">
<polygon points="220,295 207,319 233,319"/><polygon points="260,365 247,389 273,389"/>
<polygon points="329,209 316,233 342,233"/><polygon points="466,194 453,218 479,218"/>
<polygon points="502,342 489,366 515,366"/>
</g>
<g fill="#f59e0b" stroke="#b45309" stroke-width="2">
<rect x="415" y="280" width="25" height="25" rx="2"/>
<rect x="575" y="164" width="25" height="25" rx="2"/>
<rect x="585" y="335" width="25" height="25" rx="2"/>
</g>
<g stroke="#64748b" stroke-dasharray="5 5" stroke-width="2">
<line x1="390" y1="246" x2="329" y2="222"/>
<line x1="390" y1="246" x2="466" y2="207"/>
<line x1="390" y1="246" x2="427" y2="292"/>
</g>
<circle cx="390" cy="246" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
<text x="390" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">?</text>
<text x="370" y="283" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">New instance</text>
<polygon points="120,468 111,484 129,484" fill="#2563eb"/>
<text x="139" y="481" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Triangle class</text>
<rect x="305" y="468" width="16" height="16" fill="#f59e0b"/>
<text x="330" y="481" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Square class</text>
<text x="520" y="481" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1e40af">2 of 3 nearest: Triangle</text>
</svg>